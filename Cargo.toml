[package]
name = "cless"
version = "0.0.9"
edition = "2024"
authors = ["Kenshi Kamata"]
license = "MIT OR Apache-2.0"
description = "A less-like terminal pager with tree-sitter syntax highlighting"
repository = "https://github.com/knsh14/cless"
readme = "README.md"
keywords = ["less", "pager", "syntax-highlighting", "tree-sitter", "cli"]
categories = ["command-line-utilities", "text-processing"]

[dependencies]
# use-dev-tty: poll /dev/tty via select instead of mio/kqueue, which cannot
# poll /dev/tty on macOS — without it, any run with piped stdin (`cat f |
# cless`, `... | xargs cless`) dies with "Failed to initialize input reader".
crossterm = { version = "0.29", features = ["use-dev-tty"] }
unicode-width = "0.2"
regex = "1"

tree-sitter = "0.26"
tree-sitter-highlight = "0.26"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-json = "0.24"
tree-sitter-go = "0.25"
tree-sitter-bash = "0.25"
tree-sitter-md = "0.5"
tree-sitter-toml-ng = "0.7"
tree-sitter-yaml = "0.7"
tree-sitter-html = "0.23"
tree-sitter-css = "0.25"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23.4"
tree-sitter-java = "0.23.5"
tree-sitter-ruby = "0.23.1"
tree-sitter-php = "0.24.2"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-lua = "0.5.0"
tree-sitter-zig = "1.1.2"
tree-sitter-make = "1.1.1"
tree-sitter-hcl = "1.1.0"
tree-sitter-xml = "0.7.0"
tree-sitter-ini = "1.4.0"
tree-sitter-swift = "0.7.3"
tree-sitter-sequel = "0.3.11"
tree-sitter-kotlin-ng = "1.1.0"

[profile.release]
lto = true
codegen-units = 1

# cargo-binstall: install prebuilt binaries from GitHub Releases.
#   $ cargo binstall cless
# The release workflow in .github/workflows/release.yml uploads assets matching
# this URL template on every `v*` tag push.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }{ archive-suffix }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"
